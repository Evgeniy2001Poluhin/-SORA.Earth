upstream sora_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name sora-earth.online www.sora-earth.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sora-earth.online www.sora-earth.online;
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/certs/live/sora-earth.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/sora-earth.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve built SPA assets directly from disk (content-hashed, immutable).
    # These are mounted into the nginx container; serving them here avoids the
    # backend SPA catch-all returning index.html for /assets/* requests.
    location /assets/ {
        root /usr/share/nginx/spa;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /grafana/ {
        proxy_pass         http://grafana:3000/grafana/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
    location / {
        proxy_pass         http://sora_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }
    location /ws {
        proxy_pass         http://sora_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
}
