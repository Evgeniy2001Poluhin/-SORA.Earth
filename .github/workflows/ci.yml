name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Materialize Git LFS models
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_api.py \
            --ignore=tests/test_scoring_baseline.py \
            -v --tb=short --timeout=60 \
            --cov=app --cov-report=term-missing \
            -q
        env:
          DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: ""
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"

      - name: Run forecasting tests
        run: |
          python -m pytest tests/test_forecasting_*.py \
            -v --timeout=60

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  environmental-postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sora
          POSTGRES_PASSWORD: sora2026
          POSTGRES_DB: sora_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # The removed GAP-001 bootstrap script used to bring the schema up as a
      # side effect of its round-trip. The persistence tests need the tables to
      # exist, so the chain is now run explicitly rather than incidentally.
      - name: alembic upgrade head
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      - name: Run environmental persistence tests against PostgreSQL
        run: |
          python -m pytest \
            tests/test_environmental_persist.py \
            -v --tb=short --timeout=120
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: ""
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          MLFLOW_TRACKING_URI: "sqlite:///./test_mlflow.db"

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sora
          POSTGRES_PASSWORD: sora2026
          POSTGRES_DB: sora_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run integration tests
        run: |
          python -m pytest tests/test_api.py \
            -v --tb=short --timeout=60
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
