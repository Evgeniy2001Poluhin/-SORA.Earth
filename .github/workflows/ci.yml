name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS model artifacts
        shell: bash
        run: |
          git lfs ls-files

          python - <<'PY'
          from pathlib import Path

          required = [
              Path("models/scaler.pkl"),
              Path("models/model.pkl"),
              Path("models/xgb_model.pkl"),
              Path("models/stacking_meta.pkl"),
              Path("models/best_threshold.pkl"),
          ]

          pointer_prefix = b"version https://git-lfs.github.com/spec/v1"

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Required LFS artifact is missing: {path}")

              content = path.read_bytes()

              if content.startswith(pointer_prefix):
                  raise SystemExit(f"LFS artifact is still a pointer: {path}")

              if not content:
                  raise SystemExit(f"LFS artifact is empty: {path}")

              print(f"Materialized: {path} ({len(content)} bytes)")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Verify backend model loading
        env:
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"
        run: |
          python - <<'PY'
          from app.main import app

          print(f"Backend import successful: {type(app).__name__}")
          PY

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_api.py \
            --ignore=tests/test_scoring_baseline.py \
            -v --tb=short --timeout=60 \
            --cov=app --cov-report=term-missing \
            -q
        env:
          DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: ""
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"

      - name: Run forecasting tests
        env:
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"
        run: |
          python -m pytest tests/test_forecasting_*.py \
            -v --timeout=60

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, frontend-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sora
          POSTGRES_PASSWORD: sora2026
          POSTGRES_DB: sora_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run integration tests
        run: |
          python -m pytest tests/test_api.py \
            -v --tb=short --timeout=60
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
