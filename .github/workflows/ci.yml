name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked pull request targets its parent branch rather
  # than main, and with [main] here it received no checks at all and could not
  # be reviewed against CI.
  pull_request:
  # Re-run against an exact ref by hand. Without this, a result that someone
  # doubts cannot be reproduced: there is no way to ask for a run on a given
  # SHA, and the fallback is rebuilding every job locally -- which took a
  # Python 3.11 container, a PostgreSQL 16 container and several hours to
  # settle one question (#105). A push run also cannot be re-triggered without
  # an empty commit.
  #
  # The input is what makes this answer the actual question. Without it a
  # manual run checks out the branch tip, so asking "was *this commit* green"
  # gets an answer about a different tree -- which is the confusion that
  # started #105.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch or tag to check out. Defaults to the branch this run was started from."
        required: false
        type: string

concurrency:
  # Per commit for pushes, per ref for everything else.
  #
  # Keying on the ref alone meant every merge to main cancelled the run for the
  # commit before it. Measured: four of the last ten main commits have no
  # completed run -- not because none was created, but because the next merge,
  # seconds later, killed it. A commit that is never verified looks identical
  # to one that passed, and that is how "main has no CI" (#105) appeared to be
  # true when the runs existed all along.
  #
  # A push is a distinct thing to verify: superseding it loses the only check
  # that commit will ever get. A pull request is not -- a newer push to the
  # same branch makes the older run irrelevant, and cancelling saves runner
  # time. workflow_dispatch gets its own group so a manual re-run does not
  # cancel the automatic verification of the same commit, which is exactly what
  # happened the first time this input was used.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true
          # No authenticated git operation runs after checkout -- the only git
          # call is a local `git lfs ls-files` -- so the token does not need to
          # stay in .git/config where later steps could read it.
          persist-credentials: false

      - name: Verify Git LFS model artifacts
        shell: bash
        run: |
          git lfs ls-files

          python - <<'PY'
          from pathlib import Path

          required = [
              Path("models/scaler.pkl"),
              Path("models/model.pkl"),
              Path("models/xgb_model.pkl"),
              Path("models/stacking_meta.pkl"),
              Path("models/best_threshold.pkl"),
          ]

          pointer_prefix = b"version https://git-lfs.github.com/spec/v1"

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Required LFS artifact is missing: {path}")

              content = path.read_bytes()

              if content.startswith(pointer_prefix):
                  raise SystemExit(f"LFS artifact is still a pointer: {path}")

              if not content:
                  raise SystemExit(f"LFS artifact is empty: {path}")

              print(f"Materialized: {path} ({len(content)} bytes)")
          PY

      - name: Materialize Git LFS models
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: Verify backend model loading
        env:
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"
        run: |
          python - <<'PY'
          from app.main import app

          print(f"Backend import successful: {type(app).__name__}")
          PY

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_api.py \
            --ignore=tests/test_scoring_baseline.py \
            -v --tb=short --timeout=60 \
            --cov=app --cov-report=term-missing \
            -q
        env:
          DATABASE_URL: "sqlite:///./test.db"
          REDIS_URL: ""
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"

      - name: Run forecasting tests
        env:
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"
        run: |
          python -m pytest tests/test_forecasting_*.py \
            -v --timeout=60

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  environmental-postgres-tests:
    runs-on: ubuntu-latest
    # 10 was right when this job ran one test file. It now also runs the schema
    # checks -- 18 cases, each creating its own database and driving alembic in a
    # subprocess. Measured on the runner: ~2.5 min for pip install, then roughly
    # 2 minutes per case against ~30s locally, and the job was cancelled after
    # two of them. The cancellation also destroys pytest's own diagnostic, so the
    # budget has to hold before any failure inside it can be read at all.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sora
          POSTGRES_PASSWORD: sora2026
          POSTGRES_DB: sora_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # The removed GAP-001 bootstrap script used to bring the schema up as a
      # side effect of its round-trip. The persistence tests need the tables to
      # exist, so the chain is now run explicitly rather than incidentally.
      - name: alembic upgrade head
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Asserts that `alembic upgrade head` alone builds the whole schema, which
      # the step above cannot check: it migrates the shared database, and any
      # later import of the application would fill in a missing table via
      # create_all() before anyone looked. This test provisions its own scratch
      # database instead, so it is unaffected by the job's other steps and by
      # whatever the test process has imported.
      - name: Alembic builds the entire schema on its own
        run: |
          python -m pytest \
            tests/test_schema_is_migrated.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Here rather than in shell-scripts, where the first version of this lived.
      # That job installs no Python, so `alembic upgrade head` failed, the table
      # never existed, and all ten assertions failed for a reason unrelated to
      # anything they tested. This job has alembic, a postgres service, and the
      # test asserts the migration's exit status rather than silencing it.
      - name: Period provenance constraints against PostgreSQL
        run: |
          python -m pytest \
            tests/test_period_constraints_postgres.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Runs scripts/backfill_indicator_periods.py itself -- real argument
      # parsing, real HTTP against a localhost stub, real UPDATE -- because the
      # two defects review found (a recheck that could not reach the rows it
      # exists to correct, and a date left behind when a verdict was withdrawn)
      # both live inside main() and are invisible to anything that only asserts
      # against its own copy of the SQL.
      - name: The backfill write path, executed, against PostgreSQL
        run: |
          python -m pytest \
            tests/test_backfill_integration_postgres.py \
            -v --tb=short --timeout=600
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # "Eight tests pass" is a statement about the tests. This restores each
      # defect review found, one at a time, on a temporary copy, and fails if any
      # of them survives -- so the claim that these tests discriminate is made
      # here rather than in a review comment about a run nobody else made.
      # The baseline runs first: without it, "caught" cannot be told from a test
      # that fails against everything, including the unmodified script.
      - name: Mutation testing for the backfill
        run: bash tools/mutation_backfill_periods.sh
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Five of its six cases need a real PostgreSQL: the session TimeZone
      # behaviour they pin down is PostgreSQL's, and on SQLite they skip. A
      # skipped test proves nothing, so it needs a job where it runs.
      - name: data_refresh_log timestamp handling against PostgreSQL
        run: |
          python -m pytest \
            tests/test_refresh_log_timestamps.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Named here because this job lists its files explicitly: a new
      # *_postgres.py file is skipped by backend-tests (SQLite, so the marker
      # skips it) and not picked up here unless it is added, which means nine
      # tests that pass locally and never execute in CI. SORA_OFFLINE stays
      # unset for this step alone -- the fetch is stubbed by a localhost HTTP
      # server, and the offline gate would short-circuit it before the stub is
      # reached.
      - name: World Bank series ingestion against PostgreSQL
        run: |
          python -m pytest \
            tests/test_world_bank_series_postgres.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Added by #90 and never run anywhere until now: it was not listed here,
      # and backend-tests skips it. Twelve tests that passed on a laptop and
      # nowhere else. Found by tests/test_postgres_files_are_wired_into_ci.py.
      - name: Point-in-time reads against PostgreSQL
        run: |
          python -m pytest \
            tests/test_point_in_time_postgres.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # The write path #121 shipped with could not store a single row: a 71-char
      # content revision into a VARCHAR(64). SQLite ignores the length, so the
      # entire suite was green and production raised StringDataRightTruncation
      # on the first run. This executes the real dict builder and the real
      # upsert against a migrated PostgreSQL, which is the only place the width
      # is enforced.
      # The axis freshness is measured from, per temporal_kind. PostgreSQL-only:
      # the query uses EXTRACT(EPOCH ...) and an aggregate FILTER, and asserting
      # it on SQLite would prove something about a database nobody deploys.
      - name: Source vintage axis against PostgreSQL
        run: |
          python -m pytest \
            tests/test_source_vintage_axis_postgres.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # What the runner stores, read back. The attention-view tests fill these
      # columns in by hand, so without this the write path has no coverage and a
      # dropped field passes every check.
      - name: Run record write path against PostgreSQL
        run: |
          python -m pytest \
            tests/test_run_record_is_written_postgres.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      - name: Ingester write path against PostgreSQL
        run: |
          python -m pytest \
            tests/test_ingest_write_postgres.py \
            tests/test_coordinate_backfill_postgres.py \
            -v --tb=short --timeout=300
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      - name: Run environmental persistence tests against PostgreSQL
        run: |
          python -m pytest \
            tests/test_environmental_persist.py \
            -v --tb=short --timeout=120
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: ""
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          MLFLOW_TRACKING_URI: "sqlite:///./test_mlflow.db"

  integration-tests:
    runs-on: ubuntu-latest
    # Importing app.main costs 4m18s here -- torch, SHAP, transformers, chromadb --
    # before a single test runs. 15 minutes killed the job mid-suite; backend-tests
    # already allows 30 for the same import.
    timeout-minutes: 30
    needs: [backend-tests, frontend-checks]
    # Runs on pull requests too, not only on main. It was main-only, and because
    # its `needs` were red on main for two weeks it simply never executed -- so
    # the missing LFS step below went unnoticed until the first green main
    # unblocked it. A job that only runs after merge cannot gate anything.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sora
          POSTGRES_PASSWORD: sora2026
          POSTGRES_DB: sora_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # tests/test_api.py imports app.main, which unpickles models/*.pkl. Without
      # this the checkout leaves LFS pointers in place and the import dies with
      # `_pickle.UnpicklingError: invalid load key, 'v'` -- the 'v' of the
      # pointer's own "version https://git-lfs.github.com/spec/v1" first line.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # This job had no schema step: it relied on conftest's create_all() to
      # build the tables as a side effect of importing. That is the behaviour
      # this branch removes, and the guard in conftest refused it -- 15 tables
      # in an empty sora_earth. Provisioning goes through migrations, like
      # everywhere else.
      - name: alembic upgrade head
        run: alembic upgrade head
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"

      # Here rather than in environmental-postgres-tests: the startup check
      # imports app.main, which unpickles models/*.pkl, and this is the job that
      # materialises LFS. The column type comparison also runs on PostgreSQL only
      # and skips on SQLite, so it needs a job where it actually runs.
      - name: Startup schema check against PostgreSQL
        run: |
          python -m pytest tests/test_startup_schema_check.py \
            -v --tb=short --timeout=180
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"

      # The other direction. assert_schema_ready checks that every model table
      # and column exists in the database -- model within schema. It cannot see
      # a column the *database* has and the model does not, which is how eight
      # period_* columns, a whole table and four indexes came to be invisible
      # to the ORM while autogenerate proposed dropping them (#88). Needs a
      # migrated PostgreSQL, so it sits beside the startup check rather than in
      # backend-tests.
      - name: Schema drift — the models must describe the database
        run: |
          python -m pytest tests/test_schema_drift_postgres.py \
            -v --tb=short --timeout=180
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"

      - name: Run integration tests
        run: |
          python -m pytest tests/test_api.py \
            tests/test_mlflow_stats_reads_configured_database.py \
            tests/test_migration_temporal_provenance.py \
            tests/test_aggregator_selection_postgres.py \
            -v --tb=short --timeout=60 --timeout-method=thread
        env:
          DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_earth"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-test-secret"
          SORA_ADMIN_TOKEN: "ci-test-admin"
          # Without these the suite reached test_evaluate_success and hung for
          # 7m46s until the job was killed. SORA_OFFLINE gates the outbound World
          # Bank and MLflow calls (app/external_data.py:109,135,194 and
          # app/mlflow_tracking.py:12), which a runner cannot reach. backend-tests
          # has carried both for a while; this job never did, and never ran to
          # completion, so nobody found out.
          SORA_OFFLINE: "1"
          RUN_SCHEDULER: "false"

  # The shell scripts had no CI at all. tests/test_backup_lock.sh has existed for
  # a while and has never run here, which is the same as not having it: a test
  # nobody executes cannot fail, and a green board said nothing about any of this.
  shell-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Two gates, deliberately at different strictness.
      #
      # Repo-wide at `error` only. Eight scripts carry warning- and style-level
      # findings today (tests/test_backup_lock.sh alone has 22). Gating everything
      # at full strictness would mean fixing all of them here, in a pull request
      # about backups -- so the wide gate catches what is actually broken, and the
      # existing findings are left for their own change rather than absorbed
      # silently into this one.
      #
      # The files this pull request owns are held to every severity, where they
      # already stand at zero. New debt in them is blocked from the start; that is
      # much cheaper than the 22 findings above, which were also once zero.
      - name: ShellCheck
        run: |
          shellcheck --version | head -2

          echo "--- every shell script, error severity"
          find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' \
            -print0 | xargs -0 shellcheck -S error

          echo "--- the owned set, every severity"
          shellcheck -S style \
            scripts/backup_local_daily.sh \
            tests/test_backup_local_daily.sh \
            tests/test_backup_local_integration.sh \
            tools/mutation_backup_local.sh \
            scripts/deploy_production.sh \
            tests/test_deploy_production.sh \
            tools/mutation_backfill_periods.sh \
            tools/wait_for.sh \
            tests/test_wait_for.sh \
            tools/mutation_wait_for.sh

      # These skip on macOS -- flock does not exist there -- so this Linux job is
      # the only place they actually execute.
      - name: Behavioural tests for the daily local backup
        run: bash tests/test_backup_local_daily.sh

      # The guard is almost entirely refusals, so the tests are almost entirely
      # refusals: a wrong branch, an unmerged rollback target, a container the
      # compose file does not declare, a port reachable off-host, a certificate
      # store nothing renews. Each stands for something that actually happened.
      # Twice, because the two environments differ in the way that matters.
      # Production deploys as root; this runner is not root. An earlier version
      # created the lock directory with `install -d -o root -g root`, which a
      # non-root caller cannot do: all 77 tests passed in a root container and 47
      # failed here. Testing one privilege level leaves the other unverified, and
      # it was the untested one that shipped.
      - name: Behavioural tests for the deployment guard
        run: bash tests/test_deploy_production.sh

      # Waiting is the long-running operation that never got the discipline the
      # backups and the deployment guard have: a deadline, an owner, cleanup on
      # every exit path. Six abandoned polling loops in one session -- one of
      # them waiting on a process its own watchdog had killed hours earlier --
      # are what this replaces. Almost all of its tests are refusals.
      # The waiter is Python behind a thin shell wrapper. Compiled before it is
      # run, so a syntax error is reported as one rather than as every
      # behavioural case failing at once.
      - name: The managed-wait implementation compiles
        run: python3 -m py_compile tools/wait_for.py

      - name: Behavioural tests for managed waits
        run: bash tests/test_wait_for.sh

      # And the run that says those tests discriminate. It found a defect in its
      # own first mutation: the anchor matched, the file was written, and the
      # mutant still behaved correctly, so MISSED meant nothing about the test.
      - name: Mutation testing for managed waits
        run: bash tools/mutation_wait_for.sh

      - name: Behavioural tests for the deployment guard (as root)
        run: sudo -E bash tests/test_deploy_production.sh

      # Runs the suite against deliberately broken copies of the script and fails
      # if any of them survives. Without it, "23 tests pass" is a statement about
      # the tests, not about the script: an earlier run of this tool is what
      # showed the empty-dump guard could be deleted with every test still green.
      # The copies are temporary; the tracked script is never modified.
      - name: Mutation testing
        run: bash tools/mutation_backup_local.sh

      # Verified where the unit's assumptions hold. In a bare container it reports
      # a missing docker.service and a non-executable command -- both artefacts of
      # the container, not defects, and indistinguishable from real findings unless
      # the environment is made to match. So the production path is staged first.
      - name: systemd unit verification
        run: |
          # Modes come from the repository, never forced here.
          #
          # This step first used `install -m 0755`, which hid the defect it exists
          # to catch: scripts/backup_local_daily.sh was committed non-executable,
          # so ExecStart could not run it. Production survived only because a
          # hand-installed copy carried the bit, and a `git pull` replaced it with
          # the tracked one -- leaving the nightly backup broken with nothing
          # reporting it. Forcing the mode made CI green over exactly that.
          #
          # systemd-analyze does detect it: a present but non-executable command
          # gives "is not executable: Permission denied" and exit 1. Measured.
          sudo mkdir -p /opt/sora_earth_ai_platform/scripts
          sudo cp --preserve=mode scripts/backup_local_daily.sh \
            /opt/sora_earth_ai_platform/scripts/backup_local_daily.sh
          sudo cp --preserve=mode infra/systemd/sora-backup-local.service \
            /etc/systemd/system/sora-backup-local.service
          sudo cp --preserve=mode infra/systemd/sora-backup-local.timer \
            /etc/systemd/system/sora-backup-local.timer

          for unit in sora-backup-local.service sora-backup-local.timer; do
            # Status and output both. Measured: systemd-analyze exits 1 whenever it
            # reports anything, so the status is a real signal -- checked against a
            # unit with an unknown key and a missing command, which it caught. The
            # output is asserted empty as well because that is the legible half:
            # the status says something is wrong, the text says what.
            rc=0
            out="$(systemd-analyze verify "/etc/systemd/system/$unit" 2>&1)" || rc=$?
            if [ -n "$out" ] || [ "$rc" -ne 0 ]; then
              echo "$unit failed verification (exit $rc):" >&2
              echo "$out" >&2
              exit 1
            fi
            echo "$unit verified clean"
          done

      # A dump that has never been restored is a hypothesis. This runs the script
      # itself against a throwaway Compose stand and restores the archive the
      # script published -- not one this step made with its own pg_dump, which
      # would prove PostgreSQL can round-trip a file and nothing about the
      # container invocation or the copy out, where the real risk lives.
      #
      # The test owns its stand: it brings the project up, waits with a real
      # deadline, and fails if the database never arrives. An earlier version of
      # this step did the waiting here in a loop that never checked whether the
      # budget was exhausted, so an unready database fell through to a test that
      # prints SKIP and exits 0 -- green, having verified nothing.
      - name: Restore against a real PostgreSQL
        run: bash tests/test_backup_local_integration.sh

      - name: Remove any stand left behind
        if: always()
        run: |
          docker ps -aq --filter 'name=sora-backup-it-' | xargs -r docker rm -f
          docker volume ls -q --filter 'name=sora-backup-it-' | xargs -r docker volume rm -f

  # A clean database must be reachable from migrations alone. Production was
  # bootstrapped with Base.metadata.create_all(), which is not reproducible from
  # the repository, so this gate runs the chain against an empty PostgreSQL.
  migration-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sora
          POSTGRES_PASSWORD: sora2026
          POSTGRES_DB: sora_bootstrap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_bootstrap"
      TEST_DATABASE_URL: "postgresql://sora:sora2026@localhost:5432/sora_bootstrap"
      SORA_OFFLINE: "1"
      RUN_SCHEDULER: "false"
      SECRET_KEY: "ci-test-secret"
      SORA_ADMIN_TOKEN: "ci-test-admin"
    steps:
      # tests/conftest.py imports app.main, which unpickles the LFS models, so
      # the scenario step needs them materialised like backend-tests does.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Assert the database starts empty
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          tables = inspect(engine).get_table_names()
          assert tables == [], f"database is not empty: {tables}"
          print("Database is empty, as required for a bootstrap test")
          PY

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: Verify schema and single head
        run: |
          alembic current
          alembic heads
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          views = set(inspector.get_view_names())

          # region_esg_scores backs the regional_esg_snapshot view; both must
          # exist after a migration-only bootstrap.
          required_tables = {"alembic_version", "region_esg_scores"}
          missing = required_tables - tables
          assert not missing, f"missing tables after upgrade head: {sorted(missing)}"
          assert "regional_esg_snapshot" in views, f"view missing, have: {sorted(views)}"
          print(f"{len(tables)} tables, {len(views)} views")
          PY

      # f2c9a1d47b30 is irreversible by construction: it creates tables only
      # where they are absent, so it cannot tell the ones it created from the
      # ones create_all() had already made -- and those hold data. It refuses
      # rather than move alembic_version back over tables that stay behind,
      # which would leave the recorded revision and the actual schema
      # disagreeing. That refusal is a property of the chain now, so it is
      # asserted rather than assumed.
      # The chain has three regions and each needs its own coverage. Writing the
      # round-trip as "up to the last reversible revision" would have frozen it
      # there: every revision added above f2c9a1d47b30 from now on would go
      # untested for ever, which is the opposite of what a round-trip check is
      # for. The boundary is named explicitly instead, so the region above it
      # grows with the chain.

      # 1. Everything ABOVE the boundary. Empty today -- f2c9a1d47b30 is head --
      #    and this becomes real coverage the moment a revision is added on top.
      #    Verified with a throwaway revision placed above it: its downgrade and
      #    its upgrade both ran.
      - name: downgrade and upgrade round-trip above the irreversible revision
        run: |
          alembic downgrade f2c9a1d47b30
          alembic current | grep -q f2c9a1d47b30
          alembic upgrade head
          alembic current | grep -q "$(alembic heads | awk '{print $1}')"

      # 2. The boundary itself. Named rather than reached with `-1`, which will
      #    stop pointing at it as soon as anything is stacked above.
      - name: the irreversible revision refuses to be downgraded
        run: |
          # Position at the boundary first. The step above ends at head, so once a
          # revision exists above f2c9a1d47b30 this would downgrade that one before
          # reaching the boundary -- testing something else and mutating state.
          alembic downgrade f2c9a1d47b30
          before="$(alembic current)"
          if alembic downgrade e3f8a7c15d92 2>/tmp/downgrade.err; then
            echo "expected the downgrade to be refused, but it succeeded" >&2
            exit 1
          fi
          grep -q "cannot be downgraded automatically" /tmp/downgrade.err
          if [ "$(alembic current)" != "$before" ]; then
            echo "the recorded revision moved despite the refusal" >&2
            exit 1
          fi
          echo "refused, and the recorded revision did not move"

      # 3. Everything BELOW the boundary, on its own database: it cannot be
      #    reached from head any more without crossing f2c9a1d47b30.
      - name: downgrade and upgrade round-trip below the irreversible revision
        env:
          ROUNDTRIP_URL: "postgresql://sora:sora2026@localhost:5432/sora_roundtrip"
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          admin = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with admin.connect() as conn:
              conn.execute(text("DROP DATABASE IF EXISTS sora_roundtrip"))
              conn.execute(text("CREATE DATABASE sora_roundtrip"))
          admin.dispose()
          PY
          DATABASE_URL="$ROUNDTRIP_URL" alembic upgrade e3f8a7c15d92
          DATABASE_URL="$ROUNDTRIP_URL" alembic downgrade -1
          DATABASE_URL="$ROUNDTRIP_URL" alembic upgrade e3f8a7c15d92
          # Assert where it landed. `alembic current` alone only proves the command
          # ran, and passes just as well from the wrong revision.
          DATABASE_URL="$ROUNDTRIP_URL" alembic current | grep -q e3f8a7c15d92

      - name: Offline SQL generation
        run: |
          alembic upgrade 31e5cc432377:b7c1e4a92f30 --sql > /tmp/offline.sql
          grep -q 'DO \$migration\$' /tmp/offline.sql
          echo "Offline script generated without an Inspector"

      - name: Convergence scenarios against PostgreSQL
        run: |
          python -m pytest tests/test_migration_region_esg_scores.py \
            tests/test_migration_converge_on_head.py \
            -v --tb=short --timeout=120

      # The bootstrap above starts empty, so it never exercises the case this
      # chain actually has to survive: a deployment already recorded at
      # 0b0ff6d1594e, carrying the legacy table that create_all() left behind.
      # b7c1e4a92f30 is an ancestor of that revision and is therefore treated
      # as applied without ever running, so only e3f8a7c15d92 converges it.
      - name: Catch-up convergence on a database already past b7c1e4a92f30
        env:
          CATCHUP_URL: "postgresql://sora:sora2026@localhost:5432/sora_catchup"
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          admin = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with admin.connect() as conn:
              conn.execute(text("DROP DATABASE IF EXISTS sora_catchup"))
              conn.execute(text("CREATE DATABASE sora_catchup"))
          admin.dispose()

          engine = create_engine(os.environ["CATCHUP_URL"])
          with engine.begin() as conn:
              # A database stamped at 0b0ff6d1594e also has
              # environmental_observations: f7a8b9c0d1e2 creates it and is an
              # ancestor, so stamping marks it applied without running it. The
              # fixture omitted the table, and nothing after that revision
              # touched it -- until one did, and the gap surfaced as
              # "relation does not exist" from inside a later migration.
              #
              # Frozen DDL, as it stood at f7a8b9c0d1e2, for the same reason
              # region_esg_scores below is frozen: building it from today's
              # metadata would give this simulated old database columns that
              # later revisions are about to add.
              conn.execute(text("""
                  CREATE TABLE environmental_observations (
                      id               serial PRIMARY KEY,
                      region_id        varchar(32) NOT NULL,
                      country_code     varchar(3),
                      latitude         double precision,
                      longitude        double precision,
                      indicator        varchar(64) NOT NULL,
                      value            double precision,
                      unit             varchar(32),
                      source           varchar(64) NOT NULL,
                      source_record_id varchar(128),
                      source_revision  varchar(64),
                      event_time       timestamptz NOT NULL,
                      published_at     timestamptz,
                      ingested_at      timestamptz NOT NULL DEFAULT NOW(),
                      quality_score    double precision,
                      is_valid         boolean NOT NULL DEFAULT true,
                      metadata_json    text,
                      created_at       timestamptz NOT NULL DEFAULT NOW(),
                      updated_at       timestamptz
                  )
              """))
              conn.execute(text("""
                  CREATE TABLE region_esg_scores (
                      region_code   text PRIMARY KEY,
                      env_score     real,
                      social_score  real,
                      gov_score     real,
                      total_score   real,
                      confidence    real,
                      updated_at    timestamptz NOT NULL DEFAULT now()
                  )"""))
              # what cb5a035aed2f added on top of it
              conn.execute(text("ALTER TABLE region_esg_scores "
                                "ADD COLUMN id BIGINT GENERATED ALWAYS AS IDENTITY"))
              conn.execute(text("ALTER TABLE region_esg_scores ADD COLUMN sources_count INTEGER"))
              conn.execute(text("ALTER TABLE region_esg_scores ADD COLUMN signals_used INTEGER"))
              conn.execute(text("CREATE UNIQUE INDEX ix_region_esg_scores_id "
                                "ON region_esg_scores(id)"))
              conn.execute(text("""
                  CREATE VIEW regional_esg_snapshot AS
                  SELECT region_code, env_score AS e_score, social_score AS s_score,
                         gov_score AS g_score, total_score AS score, confidence,
                         ARRAY[]::text[] AS sources_used, updated_at AS computed_at
                    FROM region_esg_scores"""))
              conn.execute(text("""
                  INSERT INTO region_esg_scores
                         (region_code, env_score, social_score, gov_score, total_score, confidence)
                  SELECT 'RU-' || lpad(g::text, 3, '0'), 50+g*0.1, 60+g*0.1, 55+g*0.1, 58+g*0.1, 0.8
                    FROM generate_series(1, 85) g"""))
              # 963bec0d1503 is an ancestor of the recorded revision, so any real
              # database stamped at 0b0ff6d1594e has this table -- it either ran
              # that migration or create_all() made it. Staging it absent
              # describes a database that cannot exist, and e7b3c9d15f04 was the
              # first revision above the stamp to touch it: `ALTER TABLE
              # country_indicator_history` then failed with "relation does not
              # exist" on a database whose real counterpart holds 90,403 rows.
              conn.execute(text("""
                  CREATE TABLE country_indicator_history (
                      id             SERIAL PRIMARY KEY,
                      country_iso3   VARCHAR(10) NOT NULL,
                      country_name   VARCHAR(100),
                      indicator_code VARCHAR(100) NOT NULL,
                      indicator_name VARCHAR(150),
                      value          DOUBLE PRECISION,
                      source         VARCHAR(50) NOT NULL DEFAULT 'unknown',
                      as_of_date     TIMESTAMP,
                      fetched_at     TIMESTAMP NOT NULL DEFAULT now(),
                      refresh_job_name VARCHAR(100)
                  )"""))
              conn.execute(text("""
                  INSERT INTO country_indicator_history
                         (country_iso3, indicator_code, source, value)
                  SELECT 'SAU', 'NY.GDP.PCAP.CD', 'world_bank', 30000 + g
                    FROM generate_series(1, 40) g"""))
              conn.execute(text("CREATE TABLE alembic_version "
                                "(version_num varchar(32) NOT NULL PRIMARY KEY)"))
              conn.execute(text("INSERT INTO alembic_version VALUES ('0b0ff6d1594e')"))
          engine.dispose()
          print("legacy database staged at 0b0ff6d1594e with 85 region rows "
                "and 40 undated indicator rows")
          PY

          DATABASE_URL="$CATCHUP_URL" alembic upgrade head

          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["CATCHUP_URL"])
          with engine.begin() as conn:
              columns = dict(conn.execute(text("""
                  SELECT a.attname, format_type(a.atttypid, a.atttypmod)
                    FROM pg_attribute a
                   WHERE a.attrelid = 'region_esg_scores'::regclass
                     AND a.attnum > 0 AND NOT a.attisdropped""")).fetchall())
              pk = [r[0] for r in conn.execute(text("""
                  SELECT a.attname FROM pg_constraint con
                    JOIN pg_attribute a ON a.attrelid = con.conrelid
                                       AND a.attnum = ANY (con.conkey)
                   WHERE con.conrelid = 'region_esg_scores'::regclass
                     AND con.contype = 'p'""")).fetchall()]
              rows = conn.execute(text("SELECT count(*) FROM region_esg_scores")).scalar()
              view_rows = conn.execute(text("SELECT count(*) FROM regional_esg_snapshot")).scalar()

              # The catch-up has to reach the newest revision too, not merely the
              # one this step was written for. Asserting only region_esg_scores
              # would let every revision added above it converge untested.
              period_columns = {r[0] for r in conn.execute(text("""
                  SELECT attname FROM pg_attribute
                   WHERE attrelid = 'country_indicator_history'::regclass
                     AND attnum > 0 AND NOT attisdropped"""))}
              indicator_rows = conn.execute(text(
                  "SELECT count(*) FROM country_indicator_history")).scalar()

          assert {"period_status", "period_run_id", "period_rule_version"} <= period_columns, \
              f"the period columns did not reach a caught-up database: {sorted(period_columns)}"
          assert indicator_rows == 40, f"indicator rows were lost: {indicator_rows}"
          assert pk == ["id"], f"primary key was not moved to id: {pk}"
          assert columns["region_code"] == "character varying(10)", columns["region_code"]
          for score in ("env_score", "social_score", "gov_score", "total_score", "confidence"):
              assert columns[score] == "double precision", f"{score} is {columns[score]}"
          assert rows == 85, f"rows were lost: {rows}"
          assert view_rows == 85, f"view lost rows: {view_rows}"
          print("legacy database converged, 85 rows and the view intact")
          PY

      - name: Offline SQL generation for the catch-up revision
        run: |
          alembic upgrade 0b0ff6d1594e:e3f8a7c15d92 --sql > /tmp/offline_catchup.sql
          grep -q 'DO \$migration\$' /tmp/offline_catchup.sql
          echo "Catch-up offline script generated without an Inspector"

  # One context for branch protection to require, instead of six.
  #
  # Requiring the six jobs directly means six names that must match exactly and
  # forever: rename a job in this file and the requirement silently stops being
  # satisfiable, and the failure mode is "nothing can merge" rather than
  # "something is unprotected". One aggregate is one name to get right.
  #
  # `if: always()` is load-bearing. Without it this job is skipped whenever a
  # dependency fails -- and a skipped required check does not report a failure,
  # so the gate would open exactly when it is needed.
  #
  # Secret scanning is deliberately not aggregated here: one of its jobs is
  # legitimately skipped on some runs, and folding a routine skip into a gate
  # means either accepting skips (which hides real ones) or blocking on them.
  required-checks:
    name: required-checks
    if: always()
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - environmental-postgres-tests
      - migration-bootstrap
      - integration-tests
      - shell-scripts
      - frontend-checks
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {name: spec.get("result")
                     for name, spec in json.loads(os.environ["RESULTS"]).items()}

          for name, result in sorted(results.items()):
              print(f"  {name:<32} {result}")

          # Anything that is not `success` fails this job, including `skipped`.
          # A skipped dependency is not a pass: it means the job did not run,
          # and a gate that treats "did not run" as "went fine" is the defect
          # this exists to close.
          bad = {n: r for n, r in results.items() if r != "success"}
          if bad:
              print()
              print("FAILED: " + ", ".join(f"{n} was {r}" for n, r in sorted(bad.items())))
              sys.exit(1)

          print()
          print(f"all {len(results)} required jobs succeeded")
          PY
