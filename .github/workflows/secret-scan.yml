# A separate workflow rather than a job in ci.yml: six open pull requests edit
# that file, and adding a seventh editor would turn a mechanical conflict into
# a recurring one. Nothing here depends on the rest of CI.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The history scan is slow and only needs to catch something reaching the
    # default branch, so it runs weekly rather than per pull request.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-files:
    name: scan the working tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: gitleaks
        # Pinned by digest: a floating tag would let the meaning of a green
        # check change without a commit.
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --no-git --redact \
                   --config=/repo/.gitleaks.toml \
                   --report-format=json --report-path=/repo/gitleaks-report.json

      - name: report
        if: failure()
        # Rule, path and line only. Uploading the report as an artifact, or
        # echoing the matching line, would publish the very thing the scan
        # exists to keep out of reach.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("gitleaks-report.json")
          findings = json.loads(p.read_text() or "[]") if p.exists() else []
          print(f"{len(findings)} finding(s):")
          for f in findings:
              print(f"  {f.get('RuleID')}  {f.get('File')}:{f.get('StartLine')}")
          print("\nValues are deliberately not shown. Inspect locally:")
          print("  gitleaks detect --no-git --config=.gitleaks.toml")
          PY

  history:
    name: scan the full history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks over every commit
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source=/repo --redact \
                   --config=/repo/.gitleaks.toml \
                   --report-format=json --report-path=/repo/gitleaks-history.json
