# promtool unit tests for the "Drift Unmeasured With Traffic" expression.
#
# The expression under test is copied verbatim from
# grafana/provisioning/alerting/alerts.yml, and a pytest test
# (tests/test_drift_check_status_is_published.py) fails if the two differ.
# Each case states whether the alert condition should be true (value 1) or
# empty (condition false / no data, which Grafana maps to OK).
#
# Run with the pinned Prometheus image, which ships promtool:
#   docker run --rm --name sora-gstand-promtool-491 --entrypoint promtool \
#     -v "$PWD/tests/promtool:/work:ro" prom/prometheus:v3.15.0 \
#     test rules /work/drift_unmeasured_with_traffic_test.yml
#
# Not run by pytest or CI: promtool is not in the CI image.
rule_files: []
evaluation_interval: 1m
tests:
- name: absent_no_drift_series_with_traffic
  input_series:
  - series: http_requests_total{job="sora-app",instance="app:8000",handler="/api/v1/evaluate",method="POST",status="200"}
    values: 0+1x2000
  promql_expr_test:
  - expr: (vector(1) unless on() (((max(sora_drift_check_status{job=~"sora-app|sora-scheduler",status="measured"} and on(job) (sora_drift_check_last_run_timestamp_seconds{job=~"sora-app|sora-scheduler"}
      == on() group_left() max(sora_drift_check_last_run_timestamp_seconds{job=~"sora-app|sora-scheduler"})))) == 1) and on() ((time() - max(sora_drift_check_last_run_timestamp_seconds{job=~"sora-app|sora-scheduler"}))
      < 93600))) and on() (sum(increase(http_requests_total{job="sora-app",handler=~"/api/v1/(evaluate|predict).*"}[24h])) > 0)
    eval_time: 120000s
    exp_samples:
    - labels: '{}'
      value: 1
- name: nan_everywhere_with_traffic
