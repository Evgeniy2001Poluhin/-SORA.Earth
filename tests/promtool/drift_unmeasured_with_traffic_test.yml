  - series: sora_drift_check_status{job="sora-scheduler",instance="sched:9000",status="no_log"}
    values: _x2000 NaN
  - series: sora_drift_check_status{job="sora-scheduler",instance="sched:9000",status="insufficient_data"}
    values: _x2000 NaN
  - series: sora_drift_check_status{job="sora-scheduler",instance="sched:9000",status="unavailable"}
