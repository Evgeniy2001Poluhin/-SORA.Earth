# Stand-only Prometheus configuration. Two jobs named as in production, both
# pointed at the controllable metrics server.
#
# sora-app reads its targets from a file, so a target can vanish from the job
# without restarting Prometheus (stand.sh targets vanish|restore). When the list
# is empty the job has no up series at all, which is the "vanished target" case,
# as distinct from up=0 (a target that is listed and fails to scrape).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sora-app
    metrics_path: /app/metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/sora-app.json"]
        refresh_interval: 10s

  - job_name: sora-scheduler
    metrics_path: /scheduler/metrics
    static_configs:
      - targets: ["sora-gstand-metrics:8000"]
