# Stand-only Prometheus configuration. Two jobs, named as in production, both
# pointed at the controllable metrics server. Scrapes every 5s so a state change
# is visible within one stand step.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sora-app
    metrics_path: /app/metrics
    static_configs:
      - targets: ["sora-gstand-metrics:8000"]

  - job_name: sora-scheduler
    metrics_path: /scheduler/metrics
    static_configs:
      - targets: ["sora-gstand-metrics:8000"]
