# The deployment lock lives here rather than in /run/lock.
#
# /run/lock is mode 1777. The sticky bit prevents another user deleting root's
# lock file, but not creating it first under its predictable name -- which blocks
# deployments at will -- and not placing a symlink there, which the guard's
# `exec 9>` would follow and truncate as root.
#
# /run is a tmpfs, so the directory does not survive a reboot. systemd-tmpfiles
# recreates it from this file on boot, before any deployment can run.
#
# Install with:
#   install -m 0644 infra/tmpfiles.d/sora.conf /etc/tmpfiles.d/sora.conf
#   systemd-tmpfiles --create /etc/tmpfiles.d/sora.conf
#
# Type Path      Mode  User  Group  Age  Argument
d /run/sora 0750 root root - -
