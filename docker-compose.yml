services:
  app:
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - SORA_ADMIN_TOKEN=${SORA_ADMIN_TOKEN}
      - RUN_SCHEDULER=false
      - SORA_OFFLINE=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Prometheus scrapes `backend:8000` from infra/prometheus.yml, which both
    # compose files mount -- and the backend service is `app` here and
    # `backend` in production. Without this alias the dev Prometheus scrapes a
    # host that does not exist and reports a target that never comes up, which
    # looks like nothing rather than like an error (#94, and the same shape as
    # #91).
    networks:
      default:
        aliases:
          - backend

  scheduler:
    build: .
    command: python3 -u run_scheduler.py
    env_file:
      - .env
    environment:
      - SORA_ADMIN_TOKEN=${SORA_ADMIN_TOKEN}
      - RUN_SCHEDULER=true
      # The backend service is `app` here and `backend` in the production
      # file, so this is set in both rather than left to a default that can
      # only be right in one of them (#91).
      - SORA_BACKEND_URL=http://app:8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "grep -l run_scheduler.py /proc/[0-9]*/cmdline > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - postgres
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-sora2026}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    depends_on:
      - postgres
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: sora_earth
      POSTGRES_USER: sora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sora2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sora"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  grafana_data:
