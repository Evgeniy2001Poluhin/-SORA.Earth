# The development stack's nginx. `nginx.conf` beside this file is production's
# and cannot run here: it terminates TLS with a Let's Encrypt certificate for
# sora-earth.online, and it proxies to `backend`, which is the production
# service name. Development calls the same process `app`.
#
# Measured 2026-09-21 before this file existed: the nginx container had
# restarted 1536 times -- about 25.6 hours -- exiting each time with
#
#     [emerg] cannot load certificate
#             "/etc/letsencrypt/live/sora-earth.online/fullchain.pem"
#
# and `getent hosts backend` inside the network returned nothing while `app`
# resolved. So supplying a certificate would not have fixed it; it would have
# turned an exiting container into a running one that answers 502, which is
# harder to notice.
#
# This file is the development half only. Production keeps `nginx.conf`
# untouched, and `scripts/deploy_production.sh` loads `docker-compose.prod.yml`
# alone -- verified with `docker compose -f docker-compose.prod.yml config`,
# which lists nine services and no `app`.

worker_processes auto;
events { worker_connections 1024; }

http {
    # Kept from production deliberately, and for the same reason (#129): with a
    # statically resolved upstream, recreating the app container strands nginx
    # on the address that container used to have. On 2026-08-09 that produced
    # 4.5 minutes of 502 on the public endpoint while `docker inspect` reported
    # every container healthy. Development recreates containers far more often
    # than production does, so dropping this here would reproduce the incident
    # on a laptop and teach the wrong lesson about it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    upstream sora_backend {
        zone sora_backend 64k;
        # `app`, not `backend`. docker-compose.yml names the FastAPI service
        # `app`; tests/test_the_dev_stack_nginx_can_start.py fails if the two
        # drift apart again.
        server app:8000 resolve;
    }

    upstream sora_grafana {
        zone sora_grafana 64k;
        server grafana:3000 resolve;
    }

    # Same shape as production, so a limit that misbehaves is seen here first.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 80;
        listen [::]:80;
        # Any name: a developer reaches this as localhost, 127.0.0.1, or a
        # container name, and production's `server_name sora-earth.online`
        # would reject all three.
        server_name _;
        client_max_body_size 10m;

        # No TLS, and therefore no Strict-Transport-Security. A browser ignores
        # HSTS over plain HTTP, so sending it would be inert rather than
        # harmful -- but it would also be a claim this server cannot keep, and
        # the rest of the headers are the ones that still mean something
        # without a certificate.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        gzip on;
        gzip_types application/json text/plain text/css application/javascript image/svg+xml;
        gzip_min_length 256;

        # Both kept from production. A rule that only exists in production is a
        # rule nobody notices breaking until it is live.
        location ~* \.(sql|bak|log|gz|tar|zip|sh|key|pem|cfg|ini|env)$ {
            return 404;
        }

        location ~ /\. {
            return 404;
        }

        location /grafana/ {
            proxy_pass http://sora_grafana/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        location /ws/ {
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
