worker_processes auto;
events { worker_connections 1024; }

http {
    upstream sora_backend {
        server backend:8000;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name sora-earth.online www.sora-earth.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name sora-earth.online www.sora-earth.online;
        client_max_body_size 10m;

        ssl_certificate     /etc/letsencrypt/live/sora-earth.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sora-earth.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Gzip
        gzip on;
        gzip_types application/json text/plain text/css application/javascript image/svg+xml;
        gzip_min_length 256;

        # Block dangerous files
        location ~* \.(sql|bak|log|gz|tar|zip|sh|key|pem|cfg|ini|env)$ {
            return 404;
        }

        # Block dotfiles
        location ~ /\. {
            return 404;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana:3000/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Everything else
        location / {
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
