worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS, so upstream addresses are re-resolved instead of
    # being frozen when the worker processes start (#129).
    #
    # Without this, recreating the backend container stranded nginx on the
    # address the container used to have. On 2026-08-09 a deploy gave backend
    # the address the scheduler had been using and nginx kept sending to the
    # old one: 4.5 minutes of 502 on the public endpoint while `docker inspect`
    # reported both containers healthy and RestartCount 0. Resolution was never
    # broken -- `getent hosts backend` inside this container returned the new
    # address throughout. Only the cached one was stale.
    #
    # It is a race rather than a certainty: the deploy two hours earlier
    # produced no 502 because the address happened not to move. That is worse
    # than a reliable failure, not better.
    #
    # `valid=10s` bounds how long a stale address can be used. ipv6=off because
    # the compose network is v4 and an AAAA lookup only adds a failure mode.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    upstream sora_backend {
        # `resolve` needs a shared-memory zone; it re-resolves on the TTL above
        # rather than once at startup. Requires nginx >= 1.27.3 in the HTTP
        # upstream; this image is 1.31.3 (measured, not assumed).
        zone sora_backend 64k;
        server backend:8000 resolve;
    }

    # Same treatment, same reason. A named upstream rather than a variable in
    # proxy_pass: with a variable the URI handling changes, and `/grafana/`
    # here is a URI part that must keep behaving exactly as it does now.
    upstream sora_grafana {
        zone sora_grafana 64k;
        server grafana:3000 resolve;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name sora-earth.online www.sora-earth.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name sora-earth.online www.sora-earth.online;
        client_max_body_size 10m;

        ssl_certificate     /etc/letsencrypt/live/sora-earth.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sora-earth.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Gzip
        gzip on;
        gzip_types application/json text/plain text/css application/javascript image/svg+xml;
        gzip_min_length 256;

        # Block dangerous files
        location ~* \.(sql|bak|log|gz|tar|zip|sh|key|pem|cfg|ini|env)$ {
            return 404;
        }

        # Block dotfiles
        location ~ /\. {
            return 404;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://sora_grafana/grafana/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Everything else
        location / {
            proxy_pass http://sora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
