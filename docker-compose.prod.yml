services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-h 127.0.0.1` forces TCP, and that is the whole point of this line.
      #
      # Without a host, pg_isready connects over the Unix socket. During
      # `initdb` the entrypoint runs a temporary server that listens on the
      # socket **only** -- it logs "database system is ready to accept
      # connections" while nothing is bound to 5432 -- then shuts it down and
      # starts the real one. A socket-based check passes in that window, compose
      # marks postgres healthy, `migrate` starts on `service_healthy` and
      # connects over TCP, and alembic gets ECONNREFUSED.
      #
      # Measured on the first deployment to a fresh server, 2026-09-02:
      #
      #   20:21:38.905  temporary server: listening on Unix socket
      #   20:21:38.917  "ready to accept connections"   <- no TCP listener yet
      #   20:21:39.070  temporary server shutting down
      #   20:21:39.192  real server: listening on IPv4 0.0.0.0:5432
      #
      # The deployment refused at exit 76 with the schema untouched, which is the
      # right outcome and not the same as the bug being absent.
      #
      # A `start_period` would not fix this. It changes when the checks begin,
      # not what they measure, and the socket-only server answers whenever it is
      # asked. The check has to speak the transport its clients use.
      #
      # Only reachable with an empty volume, so it survives every deployment to a
      # server that already has a database and appears on the one that restores
      # from nothing -- during an incident.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # The single migration owner (#125).
  #
  # backend and scheduler shared one entrypoint that ran `alembic upgrade head`,
  # so `up -d` started two migrators against one database at once. Alembic takes
  # no lock spanning that; whichever lost the race died, `restart:
  # unless-stopped` brought it back, and by then the migration had usually been
  # applied. A restart loop is not a synchronisation mechanism -- it happened to
  # converge, which is a different thing from being designed to.
  #
  # `profiles` keeps it out of `docker compose up` entirely. Without it this
  # service would be a third migrator rather than the only one; it is reached
  # only by `docker compose run --rm migrate`, from scripts/deploy_production.sh,
  # before either application service is recreated.
  #
  # It talks to `postgres` directly, not `pgbouncer`. The pooler runs
  # `pool_mode = transaction`, where session-scoped state does not survive
  # between transactions -- a migration using an advisory lock, a temp table or
  # `SET LOCAL` outside its own transaction would find that out in production.
  migrate:
    profiles: ["migration"]
    user: "1000:1000"
    # No `build:` of its own. Three services with the same Dockerfile are three
    # build invocations and formally three results; the claim "migrated from the
    # image being deployed" needs identity, not similarity. One tag, built once
    # by `backend`, referenced by all three.
    image: ${SORA_APP_IMAGE:-sora_earth_app:current}
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    # DATABASE_URL and nothing else. Measured: `alembic upgrade head` takes a
    # fresh database to head with no JWT_SECRET and no ADMIN_API_KEY -- env.py
    # imports app.database, which reaches no other app module and never touches
    # app.secret_validation. A one-shot schema owner has no use for either.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    user: "1000:1000"
    volumes:
      - ./models:/app/models
      # One named volume, mounted by backend and scheduler at the same path
      # (#191). The activation lock is an flock, and flock excludes two
      # processes only when both open the *same inode* — two bind mounts of two
      # host directories would give each container its own lock file and no
      # mutual exclusion at all.
      - runtime_models:/app/runtime
    # The one place the application image is built. `migrate` and `scheduler`
    # reference the same tag, so all three are the same image by construction
    # rather than by resemblance.
    image: ${SORA_APP_IMAGE:-sora_earth_app:current}
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runtime
      args:
        # Not a URL the app routes with -- web/src/api/client.ts hardcodes the
        # path. It is the switch that decides whether the built frontend talks
        # to the API at all: web/src/api/mock.ts turns eight endpoint modules
        # into canned data when it is unset, and Dockerfile.prod declares it
        # without a default so a build that omits it stops rather than shipping
        # a convincing mock.
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    environment:
      WORKERS: "4"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ENV: production
      # Identical in both services on purpose; a mismatch would put the lock
      # file in two places and silently remove the mutual exclusion.
      SORA_RUNTIME_DIR: /app/runtime
      MLFLOW_TRACKING_URI: "http://mlflow:5556"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      HF_API_TOKEN: ${HF_API_TOKEN}
      HF_MODEL_URL: ${HF_MODEL_URL:-https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "8000"

  scheduler:
    user: "1000:1000"
    volumes:
      - ./models:/app/models
      # The same named volume at the same path as backend. Both must agree, or
      # the lock protects nothing across containers.
      - runtime_models:/app/runtime
    image: ${SORA_APP_IMAGE:-sora_earth_app:current}
    restart: unless-stopped
    command: python3 -u run_scheduler.py
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ENV: production
      # Identical in both services on purpose; a mismatch would put the lock
      # file in two places and silently remove the mutual exclusion.
      SORA_RUNTIME_DIR: /app/runtime
      MLFLOW_TRACKING_URI: "http://mlflow:5556"
      RUN_SCHEDULER: "true"
      # See #91: the service is `backend` here and `app` in docker-compose.yml.
      SORA_BACKEND_URL: "http://backend:8000"
      OPENAQ_API_KEY: ${OPENAQ_API_KEY}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "grep -l run_scheduler.py /proc/[0-9]*/cmdline > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.4
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5556
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    volumes:
      - mlflowdata:/mlflow
    expose:
      - "5556"

  nginx:
    # This service described a production that had never run. Measured on the
    # host on 2026-08-03, every line of it disagreed with the container actually
    # serving the site, which came from docker-compose.yml instead:
    #
    #   image      built nginx-spa    vs  nginx:alpine running
    #   config     ./nginx.conf as a conf.d fragment, missing limit_req,
    #              ssl_session_cache, ssl_session_timeout and proxy_connect_timeout
    #              -- 7 location blocks against the 9 that were live
    #   certs      ./certs, holding a certificate three weeks older than
    #              /etc/letsencrypt and not on certbot's renewal path, so it
    #              would have expired under a renewal that updates elsewhere
    #
    # Deploying with this file would therefore have dropped rate limiting and
    # TLS session resumption immediately, and taken TLS down later. It is
    # converged onto the topology that is verified to work, so that "deploy only
    # with the production file" becomes safe to require.
    #
    # Baking the SPA into an nginx image is a reasonable thing to want -- the
    # site currently serves it through the backend -- but it has never been
    # exercised, and adopting it silently as part of a deployment guard is how
    # the untested becomes the deployed. It belongs in its own change, with a
    # test.
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The full configuration, not a fragment. A single bind-mounted file is
      # pinned to its inode, so a later `git pull` that replaces the file leaves
      # the container reading the old copy and `nginx -s reload` re-reads the
      # stale one. scripts/deploy_production.sh recreates nginx and then compares
      # the container's copy against the repository's, because the mount cannot
      # be trusted to have followed.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-sora2026}
      - GF_SERVER_DOMAIN=sora-earth.online
      - GF_SERVER_ROOT_URL=https://sora-earth.online/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  #: Where retraining stages candidates and the champion is activated (#191).
  #: Named rather than a bind mount so both containers share one filesystem and
  #: one inode for the lock file.
  runtime_models:
  mlflowdata:
  pgdata:
  redisdata:
  grafana_data:
  prometheus_data:
