[pytest]
testpaths = tests
timeout = 30
asyncio_mode = strict
# An xfail that passes is a failure, not a quiet success.
#
# Three markers were carried for months past the defects they named: two
# described bugs that had been fixed and one an endpoint that had been
# written. The suite reported `2 xpassed` on every run and nothing acted on
# it, so the markers went on describing the code incorrectly (#1, #2).
xfail_strict = true
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::PendingDeprecationWarning
