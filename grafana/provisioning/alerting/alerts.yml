apiVersion: 1

# Every rule below has the same three-node shape, and it is the shape Grafana's
# evaluator needs in order to hand back one number per series:
#
#   A  prometheus query, instant: true      -- one sample per series, no range
#   B  reduce (last) over A                 -- a single value, never a series
#   C  threshold over B, condition: C       -- 1 = Alerting, 0 = Normal
#
# Without `instant` and the reduce, a range query returns a series of points, and
# a threshold over that is "invalid format of evaluation results" (or it fires on
# any point). A healthy value of 0 is a real Normal, not an empty result: the
# expression says what it measured and the threshold decides.
#
# noDataState is explicit on every rule. OK means "nothing to report is healthy";
# Alerting means "the absence of this series is itself the problem".
groups:
  - orgId: 1
    name: SORA MLOps Alerts
    folder: SORA
    interval: 5m
    rules:
      - uid: sora-drift-detected
        title: Drift Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Deliberately NOT job-pinned. `sora_drift_detected_total` is
              # incremented in closed_loop_retrain (app/scheduler.py), which
              # also runs in the backend via the AI-teammate route
              # (app/agents/ai_teammate.py, registered in app/main.py). Pinning
              # either job would drop drift detected from the other process
              # (#284). Leave unnamed, or use sum by (...).
              expr: increase(sora_drift_detected_total[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Data drift detected — consider retraining"

      # Drift has not been measured while the service was being used (decision
      # 2026-10-21, GPT-RETRAIN-ALERT-DECISION).
      #
      # `no_log` means the closed loop found nothing to compare. A quiet service
      # produces that legitimately, and so does a broken write path; the value
      # alone cannot say which. The traffic term is what turns it into a question:
      # the alert is silent when nothing has called /evaluate or /predict in 24h.
      #
      # `max` over the status series ignores NaN, the value before a process's
      # first check, and reads that as not measured. Not job-pinned: the closed
      # loop also runs in the backend (AI-agent route), so either process may
      # write the gauge (the same reasoning as sora-drift-detected). Summing
      # across processes would not be meaningful; the max is only "measured if
      # either measured last".
      #
      # Traffic is `http_requests_total` from prometheus_fastapi_instrumentator,
      # not a /evaluate counter: `sora_predictions_total` covers /predict alone,
      # and nothing in app/prom_metrics.py counts /evaluate. The handler regex
      # covers /api/v1/evaluate and /api/v1/predict and their sub-paths; a test
      # checks it against the real routes.
      #
      # `and on()` keeps the not-measured value only where traffic exists. Both
      # sides absent gives no data, which is OK: no traffic, nothing to say.
      #
      # After each restart the value reads not measured until the next 03:00 UTC
      # run, so an alert shortly after a deploy under traffic is expected, not a
      # fault by itself.
      - uid: sora-drift-unmeasured-with-traffic
        title: Drift Unmeasured With Traffic
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: (max(sora_drift_check_status{status="measured"}) != bool 1) and on() (sum(increase(http_requests_total{job="sora-app",handler=~"/api/v1/(evaluate|predict).*"}[24h])) > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Drift is not measured while the service receives traffic"
          description: >-
            The last closed-loop drift check produced no measurement (no_log,
            insufficient_data or unavailable), or none has run since the
            process started, and /evaluate or /predict answered requests in the
            last 24 hours. Check retrain_log and the drift endpoint for the
            reason. Silence is not evidence that drift is absent.

      # The retrain history could not be read at the last scrape (decision
      # 2026-10-21).
      #
      # This replaces "No Successful Retrain". That rule fired on the age of the
      # last success, and an age of a few weeks is what an unneeded retrain looks
      # like as well as a stopped one -- so it paged on a healthy quiet system.
      # What is a fault is that the history cannot be read at all, which the
      # endpoint reports separately from the age (see sora_retrain_history_readable).
      #
      # 0 when the last scrape read the table, 1 when the read failed. Absence
      # means the backend is not being scraped, which App Unreachable already
      # pages on, so NoData is OK here rather than a second page.
      #
      # The age is still exported as sora_retrain_seconds_since_success, for
      # reading. No rule alerts on it.
      - uid: sora-retrain-history-unreadable
        title: Retrain History Unreadable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # job named: the gauge is set at scrape time by the backend, and the
              # scheduler does not export it. Always name the job (CLAUDE.md).
              expr: sora_retrain_history_readable{job="sora-app"} == bool 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The retrain history could not be read by the metrics endpoint"
          description: >-
            A database query behind the retrain-history gauge failed at the last
            scrape. This is a fault in the read path, not a statement about
            whether a retrain is needed. Check the database and the backend log.

      - uid: sora-retrain-failed
        title: Retrain Failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # Deliberately NOT job-pinned. `sora_model_rejected_total` is
              # incremented in the scheduler (app/scheduler.py) AND in the
              # backend (app/api/infra.py, POST /mlops/auto-retrain). Pinning
              # one job would hide rejections made through the other (#284).
              expr: increase(sora_model_rejected_total[10m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        # A counter that has never been incremented is absent, and that is the
        # healthy state: no rejection has happened.
        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Model retrain was rejected (AUC degraded)"

      - uid: sora-high-latency
        title: High Prediction Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              # job named: prediction latency is observed only in the backend
              # (app/api/predict.py); the scheduler serves no predictions, so
              # its bucket series are all empty. Naming the job keeps the p95
              # from being computed across an empty second series.
              expr: histogram_quantile(0.95, rate(sora_prediction_latency_ms_bucket{job="sora-app"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [500]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        # No predictions means no latency to measure, which is quiet, not slow.
        noDataState: OK
        execErrState: Alerting
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P95 prediction latency exceeds 500ms"

      # Prometheus writes `up` = 0 when a scrape fails, and keeps the series, so
      # a down target is a sample of 0 and the threshold is `lt 1`. The earlier
      # form (`up == 0`) returned that 0 as the value, which Grafana reads as
      # Normal: the rule could never fire.
      #
      # If the job is removed from prometheus.yml the series is absent. That is
      # not healthy, so NoData alerts too.
      - uid: sora-app-down
        title: App Unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up{job="sora-app"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SORA app target is DOWN"

      # M3 coverage: a declared point supplied too few hours on a day it was due.
      #
      # gap_days counts point-days, not days: one point silent for one day is one.
      # The expected grid is every UTC day in the window crossed with the 21
      # declared points, so a point that sent nothing at all is a gap. This rule
      # reports lost usable point-days in the examined window. It does not
      # diagnose an outage on its own, and it does not clear when data arrives:
      # a historical gap stays until its day leaves the window (the M3 clock
      # start at the scheduler, or the rolling 30 days).
      #
      # job named: the gauge is written only by the scheduler, and both processes
      # export the same name (#284).
      #
      # Healthy is a real 0, which the threshold reads as Normal. An absent gauge
      # is NoData, mapped to OK: it is not this rule's to judge, and the stale
      # rule below covers it.
      - uid: sora-observation-coverage-gap
        title: M3 Observation Coverage Gap
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: sora_observation_coverage_gap_days{job="sora-scheduler"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Expected observation point-days are missing (M3 coverage)"
          description: >-
            gap_days counts (day, point) pairs with fewer than 19 distinct UTC
            hours, a pair with no rows included. Read the denominators beside it
            (days_examined, points_examined) at /api/v1/infra/observations/coverage.

      # The gap gauge keeps its last value when a run fails, so a stopped or
      # failing scheduler would look healthy through it. This rule reads the
      # time of the last successful report instead.
      #
      # Fires when that time has been more than 15 minutes old for 45 minutes
      # (the job runs every 15 minutes, so a healthy run keeps the age below
      # that), or when the series is absent. Absence after a restart lasts up to
      # one 15-minute cycle, which the 45-minute hold covers.
      #
      # The hold starts at the first evaluation that sees the age over 15
      # minutes, so from the last successful report the alert takes about an
      # hour, plus up to one evaluation interval. The summary says "about an
      # hour" for that reason.
      #
      # The value is the age in seconds. When the gauge is absent, the absence
      # branch is multiplied by 1e9 so that it reads as a very large age and
      # crosses the threshold; a bare absent() would read as 1 and stay Normal.
      - uid: sora-observation-coverage-stale
        title: M3 Observation Coverage Not Reporting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: absent(sora_observation_coverage_last_success_timestamp_seconds{job="sora-scheduler"}) * 1e9 or time() - sora_observation_coverage_last_success_timestamp_seconds{job="sora-scheduler"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [900]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
        # A fresh timestamp gives an age well under 900, which is Normal. The
        # expression always yields a value while Prometheus answers, so NoData
        # can only mean the query returned nothing at all; that is not evidence
        # of health, and it alerts.
        noDataState: Alerting
        execErrState: Alerting
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: "M3 coverage has not reported successfully for about an hour"
          description: >-
            The coverage gauges are not being refreshed, so the gap alert above
            is reading an old value. Check the scheduler container and its
            observation coverage job (auto_observation_coverage) before trusting
            that alert.
