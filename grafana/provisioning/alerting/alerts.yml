apiVersion: 1

groups:
  - orgId: 1
    name: SORA MLOps Alerts
    folder: SORA
    interval: 5m
    rules:
      - uid: sora-drift-detected
        title: Drift Detected
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(sora_drift_detected_total[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Data drift detected — consider retraining"

      # The rule that did not fire for a month (#188).
      #
      # `sora-retrain-failed` below counts failures, and there were none --
      # because `models/` became root-owned on 17 July, and drift never fired,
      # so the scheduler never attempted a retrain at all. No attempts, no
      # failures, and no failures read as health.
      #
      # This asks the other question: how long since one *succeeded*. It is the
      # only one of the two that can notice a system which has stopped trying.
      #
      # 14 days, and deliberately not tighter. Retraining is triggered by
      # drift, so a quiet fortnight can be legitimate -- the summary therefore
      # says "check whether it tried", not "it is broken". -1 means no
      # successful run has ever been recorded, which is never legitimate.
      - uid: sora-retrain-stale
        title: No Successful Retrain
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sora_retrain_seconds_since_success > 1209600 or sora_retrain_seconds_since_success == -1
              intervalMs: 1000
              maxDataPoints: 43200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No retrain has succeeded in over 14 days"
          description: >-
            A quiet period can be legitimate: retraining is triggered by drift,
            and no drift means no attempt. What this cannot distinguish is a
            loop that stopped working, which is why it fires -- check whether a
            retrain was attempted and what it reported, rather than assuming
            either. A value of -1 means none has ever succeeded.

      - uid: sora-retrain-failed
        title: Retrain Failed
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(sora_model_rejected_total[10m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Model retrain was rejected (AUC degraded)"

      - uid: sora-auc-degradation
        title: AUC Below Threshold
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sora_model_auc < 0.85
              intervalMs: 1000
              maxDataPoints: 43200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Model AUC dropped below 0.85"

      - uid: sora-high-latency
        title: High Prediction Latency
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(sora_prediction_latency_ms_bucket[5m])) > 500
              intervalMs: 1000
              maxDataPoints: 43200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P95 prediction latency exceeds 500ms"

      - uid: sora-app-down
        title: App Unreachable
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="sora-app"} == 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SORA app target is DOWN"

      - uid: sora-forecast-mae-high
        title: Forecast MAE Degradation (Score)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sora_forecast_mae_current{metric="score", model="ensemble"} > 10
              intervalMs: 1000
              maxDataPoints: 43200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Forecast MAE for Score metric exceeded 10 (high error rate)"

      - uid: sora-forecast-mae-spike
        title: Forecast MAE Spike (20% increase)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (sora_forecast_mae_current{metric="score"} - sora_forecast_mae_current{metric="score"} offset 6h)
                / (sora_forecast_mae_current{metric="score"} offset 6h) > 0.20
              intervalMs: 1000
              maxDataPoints: 43200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Forecast MAE increased by >20% compared to 6 hours ago"

      - uid: sora-forecast-rmse-high
        title: Forecast RMSE Degradation (Score)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sora_forecast_rmse_current{metric="score", model="ensemble"} > 15
              intervalMs: 1000
              maxDataPoints: 43200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Forecast RMSE for Score metric exceeded 15 (high error variance)"

      - uid: sora-forecast-rmse-spike
        title: Forecast RMSE Spike (2× baseline)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sora_forecast_rmse_current{metric="score"}
                > 2 * avg_over_time(sora_forecast_rmse_current{metric="score"}[24h] offset 24h)
              intervalMs: 1000
              maxDataPoints: 43200
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Forecast RMSE spiked >2× the 24h baseline (possible data quality issue)"

      - uid: sora-forecast-r2-negative
        title: Forecast R² Negative (Score)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sora_forecast_r2_current{metric="score", model="ensemble"} < 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Forecast R² is negative — model performs worse than baseline mean predictor"
