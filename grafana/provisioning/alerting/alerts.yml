apiVersion: 1

groups:
  - orgId: 1
    name: SORA MLOps Alerts
    folder: SORA
    interval: 5m
    rules:
      - uid: sora-drift-detected
        title: Drift Detected
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # Deliberately NOT job-pinned. `sora_drift_detected_total` is
              # incremented in closed_loop_retrain (app/scheduler.py), which
              # also runs in the backend via the AI-teammate route
              # (app/agents/ai_teammate.py, registered in app/main.py). Pinning
              # either job would drop drift detected from the other process
              # (#284). Leave unnamed, or use sum by (...).
              expr: increase(sora_drift_detected_total[5m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Data drift detected — consider retraining"

      # The rule that did not fire for a month (#188).
      #
      # `sora-retrain-failed` below counts failures, and there were none --
      # because `models/` became root-owned on 17 July, and drift never fired,
      # so the scheduler never attempted a retrain at all. No attempts, no
      # failures, and no failures read as health.
      #
      # This asks the other question: how long since one *succeeded*. It is the
      # only one of the two that can notice a system which has stopped trying.
      #
      # 14 days, and deliberately not tighter. Retraining is triggered by
      # drift, so a quiet fortnight can be legitimate -- the summary therefore
      # says "check whether it tried", not "it is broken". -1 means no
      # successful run has ever been recorded, which is never legitimate.
      - uid: sora-retrain-stale
        title: No Successful Retrain
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # job named because this gauge has a single writer: the backend,
              # in app/metrics_endpoint.py, recomputed on each /metrics scrape.
              # The scheduler exports the same name with the default 0 (it never
              # sets it), so an unnamed selector would also match a series that
              # is permanently 0 and can never carry the -1 this alert needs to
              # see. "Always name the job" (CLAUDE.md), pinned to the one that
              # writes it -- and pinned to sora-app, not the sora-scheduler a
              # naive reading would choose, which is exactly what would break
              # this alert (#284).
              expr: sora_retrain_seconds_since_success{job="sora-app"} > 1209600 or sora_retrain_seconds_since_success{job="sora-app"} == -1
              intervalMs: 1000
              maxDataPoints: 43200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No retrain has succeeded in over 14 days"
          description: >-
            A quiet period can be legitimate: retraining is triggered by drift,
            and no drift means no attempt. What this cannot distinguish is a
            loop that stopped working, which is why it fires -- check whether a
            retrain was attempted and what it reported, rather than assuming
            either. A value of -1 means none has ever succeeded.

      - uid: sora-retrain-failed
        title: Retrain Failed
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # Deliberately NOT job-pinned. `sora_model_rejected_total` is
              # incremented in the scheduler (app/scheduler.py) AND in the
              # backend (app/api/infra.py, POST /mlops/auto-retrain). Pinning
              # one job would hide rejections made through the other (#284).
              expr: increase(sora_model_rejected_total[10m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Model retrain was rejected (AUC degraded)"

      - uid: sora-high-latency
        title: High Prediction Latency
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # job named: prediction latency is observed only in the backend
              # (app/api/predict.py); the scheduler serves no predictions, so
              # its bucket series are all empty. Naming the job keeps the p95
              # from being computed across an empty second series.
              expr: histogram_quantile(0.95, rate(sora_prediction_latency_ms_bucket{job="sora-app"}[5m])) > 500
              intervalMs: 1000
              maxDataPoints: 43200
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P95 prediction latency exceeds 500ms"

      - uid: sora-app-down
        title: App Unreachable
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="sora-app"} == 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SORA app target is DOWN"

      # M3 coverage: a declared point supplied too few hours on a day it was due.
      #
      # gap_days counts point-days, not days: one point silent for one day is one.
      # The expected grid is every UTC day in the window crossed with the 21
      # declared points, so a point that sent nothing at all is a gap. This rule
      # reports lost usable point-days in the examined window. It does not
      # diagnose an outage on its own, and it does not clear when data arrives:
      # a historical gap stays until its day leaves the window (the M3 clock
      # start at the scheduler, or the rolling 30 days).
      #
      # job named: the gauge is written only by the scheduler, and both processes
      # export the same name (#284).
      - uid: sora-observation-coverage-gap
        title: M3 Observation Coverage Gap
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: sora_observation_coverage_gap_days{job="sora-scheduler"} > 0
              intervalMs: 1000
              maxDataPoints: 43200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Expected observation point-days are missing (M3 coverage)"
          description: >-
            gap_days counts (day, point) pairs with fewer than 19 distinct UTC
            hours, a pair with no rows included. Read the denominators beside it
            (days_examined, points_examined) at /api/v1/infra/observations/coverage.

      # The gap gauge keeps its last value when a run fails, so a stopped or
      # failing scheduler would look healthy through it. This rule reads the
      # time of the last successful report instead.
      #
      # Fires when that time has been more than 15 minutes old for 45 minutes
      # (the job runs every 15 minutes, so a healthy run keeps the age below
      # that), or when the series is absent. Absence after a restart lasts up to
      # one 15-minute cycle, which the 45-minute hold covers.
      - uid: sora-observation-coverage-stale
        title: M3 Observation Coverage Not Reporting
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: absent(sora_observation_coverage_last_success_timestamp_seconds{job="sora-scheduler"}) or time() - sora_observation_coverage_last_success_timestamp_seconds{job="sora-scheduler"} > 900
              intervalMs: 1000
              maxDataPoints: 43200
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: "M3 coverage has not reported successfully for 45 minutes"
          description: >-
            The coverage gauges are not being refreshed, so the gap alert above
            is reading an old value. Check the scheduler container and its
            observation coverage job (auto_observation_coverage) before trusting
            that alert.
