<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SORA.Earth ESG widget</title>
<style>
*{box-sizing:border-box;margin:0;font-family:ui-sans-serif,system-ui,Inter,Arial}
body{background:#0a120f;color:#cfe;padding:16px}
.w{max-width:380px;margin:auto;border:1px solid rgba(255,255,255,.1)}
.h{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#15B887;font-weight:700}
.b{padding:16px}
label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6f8980;margin:10px 0 4px}
input{width:100%;background:#04130d;border:1px solid rgba(255,255,255,.12);color:#fff;padding:8px;border-radius:0;font-size:13px}
button{width:100%;margin-top:16px;background:#15B887;color:#04130d;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:none;padding:11px;cursor:pointer;font-size:12px}
.r{margin-top:16px;padding:14px;border:1px solid rgba(255,255,255,.1);display:none}
.r.show{display:block}
.v{font-size:22px;font-weight:800;color:#fff}.p{font-size:13px;color:#9fb4ac;margin-top:4px}
.f{padding:8px 16px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#456;border-top:1px solid rgba(255,255,255,.06)}
</style></head><body>
<div class="w">
<div class="h"><span class="t">SORA.Earth ESG</span><span class="t" style="color:#456">v1</span></div>
<div class="b">
<label>Probability</label><input id="probability" type="number" step="0.01" value="0.87">
<label>Budget USD</label><input id="budget" type="number" value="2000000">
<label>CO2 reduction</label><input id="co2_reduction" type="number" value="8000">
<label>Social impact 0-100</label><input id="social_impact" type="number" value="85">
<label>Duration months</label><input id="duration_months" type="number" value="18">
<label>CO2 per dollar</label><input id="co2_per_dollar" type="number" step="0.1" value="4.0">
<button id="go">Evaluate project</button>
<div class="r" id="res"><div class="v" id="verdict">-</div><div class="p" id="prob">-</div></div>
</div>
<div class="f">Powered by SORA.Earth</div>
</div>
<script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{
  const body={probability:+$('probability').value,features:{
    budget:+$('budget').value,co2_reduction:+$('co2_reduction').value,
    social_impact:+$('social_impact').value,duration_months:+$('duration_months').value,
    co2_per_dollar:+$('co2_per_dollar').value},shap_values:[]};
  $('go').textContent='Evaluating...';
  try{
    const r=await fetch('/api/v1/copilot/explain',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    $('verdict').textContent=d.verdict?d.verdict.label:'Done';
    $('prob').textContent='ML success probability: '+Math.round((d.probability||body.probability)*100)+'%';
    $('res').classList.add('show');
  }catch(e){$('verdict').textContent='Error';$('prob').textContent=String(e);$('res').classList.add('show');}
  finally{$('go').textContent='Evaluate project';}
};
</script></body></html>
